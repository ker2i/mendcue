name: Deploy MendCue demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'demo-site/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
