openapi: 3.0.3
info:
  title: Appliance Intake API
  version: 1.0.0
  description: |
    Tenant-aware appliance service intake. One engine serves the embedded widget,
    hosted business site, staff dashboard, and headless REST API.
    Demonstration tenants only — no production insurer onboarding is claimed.
servers:
  - url: https://PLATFORM_HOST/api/v1
paths:
  /public/widget-config/{publicKey}:
    get:
      summary: Public widget configuration
      parameters:
        - in: path
          name: publicKey
          required: true
          schema: { type: string }
      responses:
        '200': { description: Branding, features, opening message }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/sessions:
    post:
      summary: Start an anonymous intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string }
                source: { type: string, enum: [widget, hosted], default: widget }
      responses:
        '201': { description: Bootstrap code + case id }
        '403': { description: Origin not allowed }
  /sessions/exchange:
    post:
      summary: Exchange one-time bootstrap code for a case token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200': { description: Case token }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cases/{caseId}:
    get:
      summary: Read allowed case state
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Case, facts, messages, attachments }
  /cases/{caseId}/events:
    get:
      summary: Polling events, or SSE with Accept text/event-stream
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Events / stream }
  /cases/{caseId}/messages:
    post:
      summary: Submit customer message
      security: [{ caseToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
      responses:
        '201': { description: Validated reply }
        '202': { description: Accepted for background processing }
  /cases/{caseId}/attachments:
    post:
      summary: Upload photograph (JPEG/PNG/WebP, 8 MB, max 8 per case)
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
                kind: { type: string, enum: [label_photo, error_display, other] }
      responses:
        '201': { description: Stored + label outcome }
        '415': { description: Unsupported media }
  /cases/{caseId}/facts:
    patch:
      summary: Correct customer-provided information (optimistic version)
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value, version]
              properties:
                key: { type: string }
                value: {}
                version: { type: number }
      responses:
        '200': { description: Corrected }
        '409': { description: Version conflict }
  /cases/{caseId}/review:
    get:
      summary: Structured review state with editable sections and missing info
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Sections, missing fields, ack requirement }
  /cases/{caseId}/confirm-model:
    post:
      summary: Confirm photo transcription or manually supplied appliance identity
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
                correctedModel: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 80 }
                serialNumber: { type: string, maxLength: 120 }
      responses:
        '200': { description: Confirmation result }
        '400': { description: Nothing pending or invalid value }
  /cases/{caseId}/submit:
    post:
      summary: Send request (requires review; incomplete needs ack)
      security: [{ caseToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgeIncomplete: { type: boolean }
      responses:
        '201': { description: Reference + handoff version }
        '400': { description: REVIEW_REQUIRED or INCOMPLETE with missing list }
  /cases/{caseId}/request-human:
    post:
      summary: Request human assistance
      security: [{ caseToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Flagged }
  /integration/sessions:
    post:
      summary: Start intake from a business backend (scoped service key)
      security: [{ serviceKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                externalReference: { type: string }
      responses:
        '201': { description: Case + token }
  /integration/cases/{caseId}/handoff:
    get:
      summary: Retrieve structured handoff
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Handoff snapshot }
  /staff/cases:
    get:
      summary: Organization inbox (staff session)
      responses:
        '200': { description: Inbox rows }
  /staff/cases/{caseId}:
    patch:
      summary: Assignment and operational updates (CSRF + version + role)
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Updated }
        '403': { description: Read-only role }
  /staff/cases/{caseId}/attachments/{attachmentId}:
    get:
      summary: View a case photo (staff session, audit-logged)
      parameters:
        - { $ref: '#/components/parameters/CaseId' }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        '200': { description: Image bytes }
  /staff/settings:
    get:
      summary: Tenant settings, webhooks, credentials, knowledge coverage
      responses:
        '200': { description: Sanitized settings (no secrets) }
  /staff/cases/{caseId}/review:
    post:
      summary: Append technician decision and brief correction (staff cookie, CSRF, mutable role)
      description: Preserves submitted snapshots. Decision is independent of workflow status. Review history is returned in staff case events.
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, disposition, missingFacts, unsupportedAssertions, reviewSeconds, timingMethod]
              properties:
                version: { type: integer }
                disposition: { type: string, enum: [ready_to_contact, need_information, urgent_review] }
                revisedBrief: { type: string, maxLength: 12000 }
                missingFacts: { type: array, items: { type: string } }
                unsupportedAssertions: { type: array, items: { type: string } }
                unnecessaryQuestionIds: { type: array, items: { type: string } }
                reviewSeconds: { type: number, nullable: true, minimum: 0 }
                timingMethod: { type: string, enum: [manual, measured, estimated, not_recorded] }
                note: { type: string }
      responses:
        '201': { description: Append-only review event }
        '403': { description: Read-only role or CSRF failure }
        '409': { description: Version changed or request not submitted }
  /staff/cases/{caseId}/outcome:
    post:
      summary: Record repair outcome
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [useful_as_received, useful_after_corrections, needed_followup, misleading_or_unusable] }
                confirmedIssue: { type: string }
                hypothesesUseful: { type: boolean }
      responses:
        '200': { description: Saved }
  /staff/me:
    get:
      summary: Restore the current staff session (eight-hour absolute lifetime)
      security: [{staffCookie: []}]
      responses:
        '200': {description: Stable user identity, tenant identity/timezone, expiry and CSRF token}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /staff/logout:
    post:
      summary: Revoke this staff session and its notification bindings (CSRF required)
      security: [{staffCookie: []}]
      responses:
        '200': {description: Session revoked and cookies cleared}
  /staff/team:
    get:
      summary: Assignable technician IDs and names within this business
      security: [{staffCookie: []}]
      responses:
        '200': {description: Assignable users, current user ID and business timezone}
  /staff/calendar:
    get:
      summary: Active appointments overlapping a range of at most 32 days
      security: [{staffCookie: []}]
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Tenant appointments with brief summaries and timezone}
        '400': {description: Invalid range}
  /staff/cases/{caseId}/action:
    post:
      summary: Save an appointment, cancel a visit, append a note or change job status
      description: |
        CSRF and mutating staff role required. Stable clientMutationId receipts commit
        with the case/event/outbox. Retry identical input with the same ID. Reuse with
        different input or stale case versions returns 409. Appointment times use the
        server-selected business timezone; startsLocal/endsLocal are YYYY-MM-DDTHH:mm.
        Booking sets scheduled; closing/cancelling frees an active appointment.
      security: [{staffCookie: []}]
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, version, clientMutationId]
              properties:
                kind: {type: string, enum: [appointment, unschedule, note, workflow]}
                version: {type: integer, minimum: 1}
                clientMutationId: {type: string, format: uuid}
                startsLocal: {type: string, example: '2026-12-01T09:00'}
                endsLocal: {type: string, example: '2026-12-01T10:00'}
                technicianId: {type: string, format: uuid}
                note: {type: string, maxLength: 2000}
                reminderMinutes: {type: integer, nullable: true, enum: [15, 30, 60, null]}
                status: {type: string, enum: [new, reviewing, contacted, scheduled, closed, cancelled]}
      responses:
        '200': {description: Committed or replayed result with case version and appointment}
        '400': {description: Invalid appointment or note}
        '403': {description: Missing CSRF or read-only staff}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Overlap, stale version, closed/unsubmitted request or mutation ID conflict}
  /staff/cases/{caseId}/mutations/{mutationId}:
    get:
      summary: Reconcile an action receipt owned by this staff user and case
      security: [{staffCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CaseId'}
        - {in: path, name: mutationId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Original saved result}
        '404': {description: No visible receipt; does not establish in-flight request failure}
  /staff/push/config:
    get:
      summary: Push availability and public VAPID key
      security: [{staffCookie: []}]
      responses:
        '200': {description: Enabled flag and public key; no private secrets}
  /staff/push/subscriptions:
    get:
      summary: Current user's device metadata; no endpoint URLs or encryption material
      security: [{staffCookie: []}]
      responses:
        '200': {description: Opaque IDs, creation times and current-session flags}
    post:
      summary: Enroll this browser subscription for the current session (CSRF required)
      security: [{staffCookie: []}]
      responses:
        '201': {description: Opaque registration ID}
        '400': {description: Invalid subscription or unsupported provider}
        '409': {description: Device ownership conflict or five-device limit}
        '503': {description: Push not configured}
  /staff/push/subscriptions/{id}:
    delete:
      summary: Disable an owned device registration (CSRF required)
      security: [{staffCookie: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Owned registration disabled}
  /staff/push/test:
    post:
      summary: Queue a generic notification for this session (CSRF required; three per hour)
      security: [{staffCookie: []}]
      responses:
        '202': {description: Queued; does not prove device display}
        '409': {description: No eligible device binding}
        '429': {description: Test limit reached}
components:
  securitySchemes:
    staffCookie: {type: apiKey, in: cookie, name: staff_session}
    caseToken: { type: http, scheme: bearer, description: Short-lived case capability token }
    serviceKey: { type: http, scheme: bearer, description: Scoped service key (server-side only) }
  parameters:
    CaseId:
      in: path
      name: caseId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
